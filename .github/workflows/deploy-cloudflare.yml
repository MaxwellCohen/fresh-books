name: Deploy to Cloudflare

# This worker has no Workers Builds connection, so pushes to `main`
# build and deploy it from here instead.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: deno install
      - name: Deploy
        run: deno task deploy:cloudflare
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://fresh-books.to-email-max.workers.dev/)
            echo "attempt $i: $code"
            [ "$code" = 200 ] && exit 0
            sleep 10
          done
          exit 1
